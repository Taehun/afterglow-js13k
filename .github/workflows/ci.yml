# CI — lint / typecheck / 13KB 사이즈 가드 / 실브라우저 스모크 / E2E 플레이테스트
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 로컬 빌드와 동일 조건(zopfli 재압축)으로 사이즈를 재기 위해 advzip 설치
      - name: Install advzip
        timeout-minutes: 4
        run: sudo apt-get update -q && sudo apt-get install -yq advancecomp

      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # playwright-core와 같은 버전의 CLI로 설치해야 프로토콜이 맞는다.
      # 브라우저(CDN 다운로드)와 OS 의존성(apt — 미러가 느린 날이 있다)을 분리:
      # 캐시 히트면 apt는 건너뛴다 (러너 이미지에 Chrome/Firefox 기본 탑재라 핵심 lib은 이미 있음)
      - name: Install Playwright browsers (Chromium + Firefox)
        timeout-minutes: 5
        run: npx -y playwright@${{ steps.pw.outputs.v }} install chromium firefox

      - name: Install browser OS deps
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx -y playwright@${{ steps.pw.outputs.v }} install-deps chromium firefox

      # 13,312B 초과 시 build.mjs가 exit 1 → 사이즈 체크를 겸한다
      - name: Build + size guard (≤ 13,312 B)
        run: npm run build

      - name: Size summary
        run: |
          SIZE=$(stat -c%s dist/game.zip)
          echo "### 📦 dist/game.zip: **${SIZE} B** / 13,312 B ($(( SIZE * 100 / 13312 ))%)" >> "$GITHUB_STEP_SUMMARY"

      # 압축 산출물을 실브라우저(Chromium+Firefox)에서 구동 — 콘솔 에러 0 검증
      - name: Smoke test
        run: npm run smoke

      # E2E 자동 플레이 — 아이템/레벨업/서지/게임오버/재시작 어서션
      - name: Playtest
        run: npm run playtest

      - name: Upload game.zip
        uses: actions/upload-artifact@v4
        with:
          name: game-zip
          path: dist/game.zip

      - name: Upload playtest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-shots
          path: .playtest/
          if-no-files-found: ignore

  # main 푸시가 CI를 통과하면 제출 zip 내용물 그대로를 GitHub Pages에 배포
  # → https://taehun.github.io/afterglow-js13k/ 에서 바로 플레이 (배포본 = 제출본)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-zip

      - name: Unzip game into site root
        run: mkdir site && unzip -q game.zip -d site && ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
